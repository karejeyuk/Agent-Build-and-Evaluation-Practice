# 직무 유형 사전(기획서 3.4). 키워드는 담당자 프로필의 부서, 직무명, 담당 업무와 대조한다.
# 필수 확인 주제는 기획서 문구를 그대로 옮긴다. 폴백의 [담당 업무] 자리는 코드가 프로필의 담당 업무로 채운다.
sales:
  label: 영업/고객응대
  keywords: [영업, 영업관리, 고객상담, CS]
  required_topics:
    - 실적 집계·보고의 주기와 절차
    - 고객 정보 관리(CRM 입력·조회)
    - 제안·미팅 자료 작성
    - 고객 문의 응대와 기록
    - 견적·계약 서류 처리
management:
  label: 관리/지원
  keywords: [경영지원, 총무, 인사, 채용, 재무, 회계, 구매]
  required_topics:
    - 정기 서류 접수·정리
    - 결재·승인 흐름
    - 정기 보고·정산
    - 대외 발송(메일·공문)
    - 규정을 보고 판단하는 업무
production:
  label: 생산/현장
  keywords: [생산, 설비, 품질관리, 물류, 자재]
  required_topics:
    - 점검·검사 기록의 형태(종이·전산)
    - 생산·품질 수치 집계
    - 이상 발생 시 보고 체계
    - 작업 일지·인수인계
    - 정기 보고서 작성
planning:
  label: 기획/전략
  keywords: [전략기획, 사업기획, 시장조사, 경영분석]
  required_topics:
    - 정기 보고서 작성 주기
    - 자료 수집 출처와 방식
    - 분석·가공 도구
    - 회의 자료 준비
    - 의사결정에 넘기는 산출물
fallback:
  label: 폴백
  keywords: []
  required_topics:
    - "[담당 업무]의 처리 절차와 요청 경로"
    - "[담당 업무]의 처리 빈도"
    - 판단이나 우선순위가 필요한 처리
    - 쓰는 도구·시스템
    - 정기 점검·보고 업무
